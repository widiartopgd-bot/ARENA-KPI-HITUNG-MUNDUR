
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  /* Background mengikuti kertas poster */
  background-color: #F7E9C9 !important;
  background-image:
    radial-gradient(
      ellipse at 20% 20%,
      rgba(255,255,255,0.35),
      transparent 65%
    ),
    radial-gradient(
      ellipse at 80% 80%,
      rgba(224,190,125,0.13),
      transparent 65%
    ),
    repeating-linear-gradient(
      45deg,
      rgba(160,125,65,0.025) 0px,
      rgba(160,125,65,0.025) 1px,
      transparent 1px,
      transparent 5px
    );
}

.countdown {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  justify-items: center;
  background: transparent;
}

.item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.number {
  color: #07563F;
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: clamp(25px, 6vw, 68px);
  font-weight: 900;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  text-align: center;
  white-space: nowrap;

  -webkit-text-stroke: 1px #FFD700;

  text-shadow:
    0 2px 0 #D9A52E,
    0 3px 3px rgba(65,47,15,0.22);
}

.label {
  color: #07563F;
  font-family: Arial, sans-serif;
  font-size: clamp(9px, 1.7vw, 17px);
  font-weight: 900;
  letter-spacing: 1px;
  text-align: center;

  -webkit-text-stroke: 0.4px #FFD700;

  text-shadow:
    0 1px 1px rgba(65,47,15,0.2);
}
</style>
</head>

<body>

<div class="countdown">

  <div class="item">
    <div class="number" id="days">000</div>
    <div class="label">HARI</div>
  </div>

  <div class="item">
    <div class="number" id="hours">00</div>
    <div class="label">JAM</div>
  </div>

  <div class="item">
    <div class="number" id="minutes">00</div>
    <div class="label">MENIT</div>
  </div>

  <div class="item">
    <div class="number" id="seconds">00</div>
    <div class="label">DETIK</div>
  </div>

</div>

<script>
const deadline = new Date(
  "2026-12-31T23:59:59+07:00"
).getTime();

function updateCountdown() {
  const diff = Math.max(0, deadline - Date.now());
  const total = Math.floor(diff / 1000);

  document.getElementById("days").textContent =
    String(Math.floor(total / 86400)).padStart(3, "0");

  document.getElementById("hours").textContent =
    String(Math.floor(total % 86400 / 3600)).padStart(2, "0");

  document.getElementById("minutes").textContent =
    String(Math.floor(total % 3600 / 60)).padStart(2, "0");

  document.getElementById("seconds").textContent =
    String(total % 60).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
